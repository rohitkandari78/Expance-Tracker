<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Smart Expense Tracker</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-content">
            <h2>Expense Tracker</h2>
            <div class="user-info">
                <img id="userPhoto" class="user-avatar" src="" alt="User">
                <span id="userName"></span>
                <button id="signOutBtn" class="btn-icon" title="Sign Out">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M3 3a1 1 0 011-1h12a1 1 0 011 1v3a1 1 0 11-2 0V4H5v12h10v-2a1 1 0 112 0v3a1 1 0 01-1 1H4a1 1 0 01-1-1V3z"/>
                        <path d="M11 10a1 1 0 011-1h5.586l-1.293-1.293a1 1 0 011.414-1.414l3 3a1 1 0 010 1.414l-3 3a1 1 0 01-1.414-1.414L17.586 11H12a1 1 0 01-1-1z"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Dashboard Content -->
    <div class="container">
        <!-- Budget Section -->
        <div class="budget-section">
            <div class="budget-card">
                <div class="budget-header">
                    <div>
                        <h3>Monthly Budget</h3>
                        <span id="budgetMonthIndicator" style="font-size: 0.85em; color: var(--gray-500); font-weight: normal;"></span>
                    </div>
                    <button id="editBudgetBtn" class="btn-icon">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
                            <path d="M12.146.146a.5.5 0 01.708 0l3 3a.5.5 0 010 .708l-10 10a.5.5 0 01-.168.11l-5 2a.5.5 0 01-.65-.65l2-5a.5.5 0 01.11-.168l10-10zM11.207 2.5L13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 2.793L10.5 3 2 11.5V13h1.5l8.5-8.5-1.293-1.293z"/>
                        </svg>
                    </button>
                </div>
                <div id="budgetDisplay" class="budget-amount">₹0</div>
                <div class="budget-stats">
                    <div class="stat">
                        <span class="stat-label">Spent</span>
                        <span id="totalSpent" class="stat-value spent">₹0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Remaining</span>
                        <span id="remaining" class="stat-value remaining">₹0</span>
                    </div>
                </div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Add Expense Button -->
        <button id="addExpenseBtn" class="btn-primary btn-large">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"/>
            </svg>
            Add Expense
        </button>

        <!-- Expenses List -->
        <div class="expenses-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
                <h3 id="expensesTitle">Recent Expenses</h3>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button id="prevMonthBtn" class="btn-icon" style="background: rgba(255,255,255,0.2); color: white;" title="Previous Month">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"/>
                        </svg>
                    </button>
                    <span id="currentMonthBadge" style="background: rgba(255,255,255,0.2); color: white; padding: 6px 16px; border-radius: 20px; font-size: 0.9em; font-weight: 600; min-width: 150px; text-align: center;"></span>
                    <button id="nextMonthBtn" class="btn-icon" style="background: rgba(255,255,255,0.2); color: white;" title="Next Month">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"/>
                        </svg>
                    </button>
                    <button id="todayBtn" class="btn-icon" style="background: rgba(255,255,255,0.3); color: white; font-size: 0.85em; padding: 6px 12px; display: none;" title="Go to Current Month">
                        Today
                    </button>
                </div>
            </div>
            <div id="expensesList" class="expenses-list">
                <!-- Expenses will be dynamically added here -->
            </div>
            <div id="emptyState" class="empty-state">
                <svg width="100" height="100" viewBox="0 0 100 100" fill="none">
                    <circle cx="50" cy="50" r="40" stroke="#e2e8f0" stroke-width="2"/>
                    <path d="M50 30v40M30 50h40" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <p>No expenses yet</p>
                <p class="empty-subtext">Click "Add Expense" to get started</p>
            </div>
        </div>
    </div>

    <!-- Modal: Set Budget -->
    <div id="budgetModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Set Monthly Budget</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="budgetInput">Budget Amount (₹)</label>
                    <input type="number" id="budgetInput" placeholder="5000" min="0" step="100">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" data-close-modal>Cancel</button>
                <button id="saveBudgetBtn" class="btn-primary">Save Budget</button>
            </div>
        </div>
    </div>

    <!-- Modal: Add/Edit Expense -->
    <div id="expenseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="expenseModalTitle">Add Expense</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="expenseAmount">Amount (₹)</label>
                    <input type="number" id="expenseAmount" placeholder="500" min="0" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="expenseCategory">Category</label>
                    <select id="expenseCategory" required>
                        <option value="">Select category</option>
                        <option value="Food">🍔 Food</option>
                        <option value="Transport">🚗 Transport</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Entertainment">🎬 Entertainment</option>
                        <option value="Bills">💡 Bills</option>
                        <option value="Health">⚕️ Health</option>
                        <option value="Other">📦 Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="expenseDescription">Description</label>
                    <input type="text" id="expenseDescription" placeholder="Coffee with friends" required>
                </div>
                <div class="form-group">
                    <label for="expenseDate">Date</label>
                    <input type="date" id="expenseDate" required>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="splitExpenseCheckbox">
                        Split this expense
                    </label>
                </div>
                <div id="splitSection" class="split-section" style="display: none;">
                    <div class="form-group">
                        <label for="splitPeople">Split with (comma-separated names)</label>
                        <input type="text" id="splitPeople" placeholder="John, Sarah, Mike">
                    </div>
                    <div id="splitPreview" class="split-preview"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" data-close-modal>Cancel</button>
                <button id="saveExpenseBtn" class="btn-primary">Save Expense</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- App Scripts -->
    <script src="../js/firebase-config.js"></script>
    <script src="../js/classes.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
